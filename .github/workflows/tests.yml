name: Build Python 3.8 wheels

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.rst'

# Build artifacts only; this workflow cannot publish a GitHub Release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBW_BUILD_FRONTEND: 'pip; args: --no-build-isolation'
  CIBW_TEST_COMMAND: 'python "{project}/scripts/ci/test-wheel.py" "{project}"'
  CIBW_TEST_REQUIRES: 'numpy==1.21.6 pillow==9.5.0'

jobs:
  windows:
    name: CPython 3.8 / Windows 7 SP1 and Windows 10 / x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Last CPython 3.8 Windows installer; supports Windows 7 SP1.
          python-version: '3.8.10'
          architecture: x64

      - name: Select the Visual Studio 2019 compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'

      - name: Install wheel tools
        run: python -m pip install cibuildwheel==2.23.3 delvewheel==1.9.0 pefile==2024.8.26

      - name: Build, bundle DLLs and test the installed wheel
        env:
          CIBW_BUILD: cp38-win_amd64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_BUILD_WINDOWS: >-
            python -m pip install -r "{project}/scripts/ci/requirements-build-python38.txt"
            && python "{project}/scripts/fetch-vendor.py" --config-file "{project}/scripts/ffmpeg-6.1.json" C:/cibw/vendor
          CIBW_ENVIRONMENT_WINDOWS: >-
            INCLUDE="C:/cibw/vendor/include;$INCLUDE" LIB="C:/cibw/vendor/lib;$LIB"
            DISTUTILS_USE_SDK=1 MSSdk=1
            CL="/D_WIN32_WINNT=0x0601 /DWINVER=0x0601"
            LINK="/SUBSYSTEM:CONSOLE,6.01"
            PYAV_SKIP_TESTS=unicode_filename
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --add-path C:/cibw/vendor/bin -w {dest_dir} {wheel}
        run: python -m cibuildwheel --platform windows --output-dir dist

      - name: Check the wheel for known Windows 7 incompatibilities
        run: python scripts/ci/check-windows-wheel.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: pyav-12.3.0-cp38-windows-x64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  linux:
    name: CPython 3.8 / Ubuntu, Kylin and UOS / ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Enable ARM64 emulation
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install wheel tools
        run: python -m pip install cibuildwheel==2.23.3

      - name: Build, bundle FFmpeg and test the installed wheel
        env:
          CIBW_BUILD: cp38-manylinux_${{ matrix.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # glibc 2.17 is the baseline for all bundled shared libraries too.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: yum install -y alsa-lib libxcb
          CIBW_BEFORE_BUILD_LINUX: >-
            python -m pip install -r "{project}/scripts/ci/requirements-build-python38.txt"
            && python "{project}/scripts/fetch-vendor.py" --config-file "{project}/scripts/ffmpeg-6.1.json" /tmp/vendor
          CIBW_ENVIRONMENT_LINUX: >-
            LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH
            PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux2014_${{ matrix.arch }} -w {dest_dir} {wheel}
        run: python -m cibuildwheel --platform linux --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: pyav-12.3.0-cp38-linux-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
